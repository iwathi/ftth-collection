<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTTH Tools Collection</title>
    <meta name="description" content="FTTHインフラ構築とルートシミュレーションのためのツールセット">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <main class="container">
        <header class="hero">
            <h1 class="glow-text">FTTH Tools Collection</h1>
            <p class="subtitle">次世代ネットワークインフラのための設計・シミュレーションスイート</p>
        </header>

        <section class="tool-grid">
            <a href="constructor/" class="tool-card" id="constructor-link">
                <div class="card-content">
                    <div class="icon-wrapper constructor-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
                    </div>
                    <h2>FTTH Constructor</h2>
                    <p>光ネットワークの論理構成と基盤設備を設計するためのコンストラクターツール。</p>
                    <div class="card-footer">
                        <span>ツールを開く</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <a href="simulator/" class="tool-card" id="simulator-link">
                <div class="card-content">
                    <div class="icon-wrapper simulator-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="M9.5 15.5 12 13l2.5 2.5"/><path d="M12 13V7"/></svg>
                    </div>
                    <h2>Route Simulator</h2>
                    <p>地図データに基づいたFTTH配線ルートのシミュレーションと最適化ツール。</p>
                    <div class="card-footer">
                        <span>ツールを開く</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </div>
                </div>
            </a>
        </section>

        <footer>
            <p>&copy; 2026 FTTH Infrastructure Solutions</p>
        </footer>
    </main>
</body>
</html>
